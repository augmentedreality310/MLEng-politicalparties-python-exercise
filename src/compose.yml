version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    ports:
      - "8501:8501"

  model_inference_endpoint:
    build:
      context: .
      dockerfile: ./model-inference-endpoint/Dockerfile
    volumes:
      - ../data:/usr/src/app/data
      - ../data:/Users/abhinavchawla/MLEng-politicalparties-python-exercise/data
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=tweet_classifier_logreg
